version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: nkoso-db
    environment:
      POSTGRES_DB: crowdfund
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crowdfund"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: nkoso-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crowdfund
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: